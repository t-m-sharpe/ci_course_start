name: Different OSs

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    python-tests:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-latest", "macos-latest", "windows-latest"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

            - name: Install project with Python 3.13
              run: |
                  uv sync --python 3.13 --extra dev

            - name: Lint with ruff
              run: |
                  uv run ruff check .

            - name: Test with pytest
              run: |
                  uv run pytest

name: Python versions

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    workflow_dispatch:

jobs:
    python-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.12", "3.13", "3.14"]

        steps:
            - uses: actions/checkout@v7

            - name: Set up uv
              uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

            - name: Install project with Python ${{ matrix.python-version }}
              run: |
                  uv sync --python ${{ matrix.python-version }} --extra dev

            - name: Lint with ruff
              run: |
                  uv run ruff check .

            - name: Test with pytest
              run: |
                  uv run pytest
